  skill_level: "avanzado"
  style: "gourmet"
  cuisines: "todas"  # mediterránea, asiática, mexicana contemporánea, francesa, japonesa, peruana, árabe, etc.
  meal_prep: true
  meal_prep_day: "domingo"
  equipment_available:
