# Tope de gasto en la API de Anthropic (USD, sin IVA). Una actualización semanal
# completa cuesta ~$8–10. Al 80 % se avisa; al 100 % la ejecución se detiene antes
# de la siguiente llamada (los archivos ya generados se conservan).
# Para pasarlo a propósito una vez: NUTRI_SIN_LIMITE=1 python main.py ...
api_budget:
  per_run_usd: 15
  per_day_usd: 25

household:
  primary_adults: 2
  extra_lunch_person: true
  extra_lunch_days: ["martes", "miércoles", "viernes"]

